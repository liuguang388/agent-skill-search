<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Skill Search - 全网技能搜索引擎</title>
<style>
  :root {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1c2129; --border: #30363d;
    --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff;
    --accent-glow: rgba(88, 166, 255, 0.15); --tag-bg: #1a2332;
    --tag-text: #79c0ff; --mark: #f2cc60; --radius: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6;
  }
  .hero {
    text-align: center; padding: 60px 20px 32px;
    background: linear-gradient(180deg, rgba(88,166,255,0.08) 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
  }
  .hero h1 {
    font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px;
    background: linear-gradient(135deg, #58a6ff, #a371f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .hero p { color: var(--text-dim); font-size: 1.05rem; }
  .search-wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; position: relative; }
  .search-box {
    display: flex; gap: 8px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px; box-shadow: var(--shadow);
    transition: border-color 0.2s;
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow); }
  .search-box input {
    flex: 1; background: none; border: none; outline: none; color: var(--text);
    font-size: 1rem; padding: 10px 12px;
  }
  .search-box input::placeholder { color: #484f58; }
  .search-box button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 10px 20px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: background 0.2s; white-space: nowrap;
  }
  .search-box button:hover { background: #4090e0; }
  .filters { max-width: 720px; margin: 16px auto 0; padding: 0 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-chip {
    padding: 4px 12px; border-radius: 20px; font-size: 0.82rem; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text-dim);
    transition: all 0.2s; white-space: nowrap;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--text); }
  .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .stats-bar { max-width: 720px; margin: 12px auto 0; padding: 0 20px; font-size: 0.85rem; color: var(--text-dim); display: flex; justify-content: space-between; }
  .results { max-width: 760px; margin: 20px auto; padding: 0 20px; display: grid; gap: 12px; }
  .result-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; transition: border-color 0.2s; cursor: pointer;
  }
  .result-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow); }
  .result-card .header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .result-card .name { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .result-card .category-tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: var(--tag-bg); color: var(--tag-text); }
  .result-card .owner { font-size: 0.8rem; color: var(--text-dim); }
  .result-card .description { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 12px; line-height: 1.5; }
  .result-card .description em { color: var(--mark); font-style: normal; background: rgba(242,204,96,0.2); padding: 0 2px; border-radius: 2px; }
  .result-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 6px;
    font-size: 0.82rem; font-weight: 500; cursor: pointer; border: 1px solid var(--border);
    background: var(--bg-hover); color: var(--text); transition: all 0.2s; text-decoration: none;
  }
  .btn:hover { background: #2a3140; border-color: var(--accent); }
  .btn.primary { background: #1a5d2a; border-color: #2ea043; color: #7ee787; }
  .btn.primary:hover { background: #1f6b32; }
  .pagination { display: flex; justify-content: center; gap: 8px; padding: 20px; }
  .pagination button {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text); cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
  }
  .pagination button:hover:not(:disabled) { border-color: var(--accent); background: var(--bg-hover); }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .pagination .current { color: var(--accent); font-weight: 600; }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty .icon { font-size: 3rem; margin-bottom: 12px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    max-width: 640px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-header { padding: 20px 24px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: 1.2rem; color: var(--accent); }
  .modal-close { background: none; border: none; color: var(--text-dim); font-size: 1.5rem; cursor: pointer; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 20px 24px; }
  .modal-body .field { margin-bottom: 16px; }
  .modal-body .field label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 0.82rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a5d2a; color: #7ee787; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  @media (max-width: 600px) { .hero h1 { font-size: 1.6rem; } }
</style>
</head>
<body>
<div class="hero">
  <h1>&#129438; Agent Skill Search</h1>
  <p>搜索 5,147+ 个 Agent 技能，按功能查找，一键下载</p>
</div>
<div class="search-wrap">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入功能关键词，如：网页搜索、PDF处理、自动化部署..." autofocus>
    <button id="searchBtn">&#128269; 搜索</button>
  </div>
</div>
<div class="filters" id="filters"></div>
<div class="stats-bar" id="statsBar" style="display:none"><span id="resultCount"></span></div>
<div class="results" id="results">
  <div class="empty"><div class="icon">&#128270;</div><p>输入关键词开始搜索 Agent Skills</p><p style="font-size:0.85rem;margin-top:8px">试试搜索: browser, PDF, deploy, notification, 爬虫...</p></div>
</div>
<div class="pagination" id="pagination" style="display:none"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header"><h2 id="modalTitle"></h2><button class="modal-close" onclick="closeModal()">&#10005;</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const CATEGORIES = [{"name": "Coding Agents & IDEs", "count": 1162}, {"name": "Web & Frontend Development", "count": 902}, {"name": "DevOps & Cloud", "count": 375}, {"name": "Search & Research", "count": 340}, {"name": "Browser & Automation", "count": 309}, {"name": "Productivity & Tasks", "count": 202}, {"name": "CLI Utilities", "count": 169}, {"name": "Image & Video Generation", "count": 166}, {"name": "AI & LLMs", "count": 159}, {"name": "Git & GitHub", "count": 155}, {"name": "Communication", "count": 142}, {"name": "Transportation", "count": 107}, {"name": "PDF & Documents", "count": 103}, {"name": "Marketing & Sales", "count": 97}, {"name": "Media & Streaming", "count": 84}, {"name": "Health & Fitness", "count": 82}, {"name": "Notes & PKM", "count": 68}, {"name": "Calendar & Scheduling", "count": 64}, {"name": "Security & Passwords", "count": 50}, {"name": "Personal Development", "count": 48}, {"name": "Shopping & E-commerce", "count": 45}, {"name": "Apple Apps & Services", "count": 43}, {"name": "Speech & Transcription", "count": 43}, {"name": "Smart Home & IoT", "count": 40}, {"name": "Data & Analytics", "count": 36}, {"name": "Moltbook", "count": 35}, {"name": "Clawdbot Tools", "count": 34}, {"name": "Self-Hosted & Automation", "count": 32}, {"name": "iOS & macOS Development", "count": 29}, {"name": "Gaming", "count": 26}];
const PER_PAGE = 20;
let searchData = [];
let currentQuery = '';
let currentCategory = '';
let currentPage = 0;

// ===== INIT =====
(async function() {
  // Load search index
  document.getElementById('results').innerHTML = '<div class="loading">&#9203; 加载搜索索引中...</div>';
  try {
    const resp = await fetch('search_index.json');
    if (!resp.ok) throw new Error('Index not found');
    searchData = await resp.json();
    document.getElementById('results').innerHTML = '<div class="empty"><div class="icon">&#128270;</div><p>输入关键词开始搜索 5,147+ 个 Agent Skills</p><p style="font-size:0.85rem;margin-top:8px">试试搜索: browser, PDF, deploy, notification, 爬虫...</p></div>';
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="empty"><p>&#9888;&#65039; 无法加载搜索索引: ' + e.message + '</p></div>';
  }

  // Render category filters
  const fc = document.getElementById('filters');
  CATEGORIES.forEach(c => {
    const chip = document.createElement('span');
    chip.className = 'filter-chip';
    chip.textContent = c.name + ' (' + c.count + ')';
    chip.onclick = () => toggleCategory(c.name, chip);
    fc.appendChild(chip);
  });

  // Bind events
  document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
})();

// ===== SEARCH =====
function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  currentQuery = q;
  currentPage = 0;
  renderResults();
}

function toggleCategory(name, chip) {
  if (currentCategory === name) { currentCategory = ''; chip.classList.remove('active'); }
  else {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    currentCategory = name; chip.classList.add('active');
  }
  currentPage = 0;
  renderResults();
}

function search(query, category) {
  const words = query.split(/\s+/).filter(Boolean);
  let results = searchData;

  // Category filter
  if (category) {
    results = results.filter(s => s.c === category);
  }

  if (words.length === 0) return results;

  // Score each skill
  const scored = results.map(s => {
    let score = 0;
    const text = s.t;
    for (const w of words) {
      // Exact name match
      if (s.n.toLowerCase() === w) score += 100;
      // Name starts with
      else if (s.n.toLowerCase().startsWith(w)) score += 50;
      // Name contains
      else if (s.n.toLowerCase().includes(w)) score += 30;
      // Description contains
      if (s.d.toLowerCase().includes(w)) score += 10;
      // Category match
      if (s.c.toLowerCase().includes(w)) score += 5;
      // Full text contains
      const idx = text.indexOf(w);
      if (idx >= 0) score += 1;
    }
    return { ...s, score };
  });

  // Filter and sort
  if (words.length > 0) {
    scored = scored.filter(s => s.score > 0);
  }
  scored.sort((a, b) => b.score - a.score);
  return scored;
}

function highlight(text, query) {
  if (!query) return esc(text);
  const words = query.split(/\s+/).filter(Boolean);
  let result = esc(text);
  for (const w of words) {
    const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    result = result.replace(re, '<em>$1</em>');
  }
  return result;
}

// ===== RENDER =====
function renderResults() {
  const resultsDiv = document.getElementById('results');
  const statsBar = document.getElementById('statsBar');
  const paginationDiv = document.getElementById('pagination');

  const filtered = search(currentQuery, currentCategory);
  const total = filtered.length;
  const start = currentPage * PER_PAGE;
  const pageItems = filtered.slice(start, start + PER_PAGE);

  // Stats
  statsBar.style.display = 'flex';
  document.getElementById('resultCount').textContent =
    '找到 ' + total.toLocaleString() + ' 个技能' +
    (total > 0 ? '（显示 ' + (start + 1) + '-' + Math.min(start + PER_PAGE, total) + '）' : '');

  // Results
  if (pageItems.length === 0) {
    resultsDiv.innerHTML = '<div class="empty"><div class="icon">&#129335;</div><p>没有找到匹配的技能</p><p style="font-size:0.85rem">试试换个关键词</p></div>';
  } else {
    resultsDiv.innerHTML = pageItems.map(r => `
      <div class="result-card" onclick="showDetail('${esc(r.s)}')">
        <div class="header">
          <span class="name">${highlight(r.n, currentQuery)}</span>
          <span class="category-tag">${esc(r.c)}</span>
          ${r.o ? '<span class="owner">by ' + esc(r.o) + '</span>' : ''}
        </div>
        <div class="description">${highlight(r.d || '', currentQuery)}</div>
        <div class="actions" onclick="event.stopPropagation()">
          <button class="btn primary" onclick="copyInstall('${esc(r.i)}', this)">&#128203; 复制安装命令</button>
          <a class="btn" href="${esc(r.u)}" target="_blank" rel="noopener">&#128279; ClawHub</a>
        </div>
      </div>
    `).join('');
  }

  // Pagination
  const totalPages = Math.ceil(total / PER_PAGE);
  if (totalPages > 1) {
    paginationDiv.style.display = 'flex';
    paginationDiv.innerHTML = `
      <button ${currentPage === 0 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">&#8592; 上一页</button>
      <span class="current">${currentPage + 1} / ${totalPages}</span>
      <button ${currentPage + 1 >= totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">下一页 &#8594;</button>
    `;
  } else {
    paginationDiv.style.display = 'none';
  }
}

function goPage(p) {
  currentPage = Math.max(0, p);
  renderResults();
  window.scrollTo({ top: 400, behavior: 'smooth' });
}

function showDetail(slug) {
  const skill = searchData.find(s => s.s === slug);
  if (!skill) return;
  document.getElementById('modalTitle').textContent = skill.n;
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>描述</label><p>${esc(skill.d || '无描述')}</p></div>
    <div class="field"><label>分类</label><p>${esc(skill.c)}</p></div>
    ${skill.o ? '<div class="field"><label>发布者</label><p>' + esc(skill.o) + '</p></div>' : ''}
    <div class="field"><label>安装命令</label><pre><code>${esc(skill.i)}</code></pre></div>
    <div class="field">
      <button class="btn primary" onclick="copyInstall('${esc(skill.i)}', this)">&#128203; 复制安装命令</button>
      <a class="btn" href="${esc(skill.u)}" target="_blank" style="margin-left:8px">&#128279; 在 ClawHub 查看</a>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

function copyInstall(cmd, btn) {
  const ta = document.createElement('textarea');
  ta.innerHTML = cmd;
  navigator.clipboard.writeText(ta.value).then(() => {
    btn.classList.add('copied'); btn.textContent = '&#9989; 已复制!';
    showToast('安装命令已复制到剪贴板');
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '&#128203; 复制安装命令'; }, 2000);
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg; toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
</script>
</body>
</html>
