function translateChineseQuery(query) {
  // 对于每个中文词，查找映射表并添加对应的英文词
  const words = query.split(/\s+/);
  const expanded = [];
  for (const w of words) {
    expanded.push(w);

    } else {
      // 检查部分匹配（较长的中文词可能包含中文关键词）
      for (const [cn, en] of Object.entries(CN_KEYWORD_MAP)) {
        if (w.includes(cn) && cn.length >= 2) {
          expanded.push(en);
        }
      }
    }
  }
  return expanded.join(' ').toLowerCase();
}

// ===== 搜索 =====
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  currentQuery = q;
  currentPage = 0;
  renderResults();
}

function toggleCategory(name, chip) {
  const allChip = document.getElementById('filters').firstChild;
  if (currentCategory === name) {
    currentCategory = '';
    chip.classList.remove('active');
    allChip.classList.add('active');
  } else {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    currentCategory = name;
    chip.classList.add('active');
  }
  currentPage = 0;
  renderResults();
}

function search(query, category) {
  let results = searchData;

  // 分类筛选
  if (category) {
    results = results.filter(s => s.c === category);
  }

  if (!query || query.trim() === '') return results;

  // 扩展查询：中文词 → 英文词
  const expandedQuery = translateChineseQuery(query);
  const words = expandedQuery.split(/\s+/).filter(Boolean);

  // 评分
  const scored = results.map(s => {
    let score = 0;
    const text = s.t || '';
    const name = (s.n || '').toLowerCase();
    const desc = (s.d || '').toLowerCase();
    const cat = (s.c || '').toLowerCase();
    const cnCat = (s.cc || '').toLowerCase();
    const cnKw = (s.ck || '').toLowerCase();

    for (const w of words) {
      const lw = w.toLowerCase();
      // 完全匹配名称
      if (name === lw) score += 100;
      // 名称前缀匹配
      else if (name.startsWith(lw)) score += 50;
      // 名称包含
      else if (name.includes(lw)) score += 30;
      // 描述包含
      if (desc.includes(lw)) score += 10;
      // 英文分类匹配
      if (cat.includes(lw)) score += 7;
      // 中文分类匹配
      if (cnCat.includes(lw)) score += 7;
      // 中文关键词匹配
      if (cnKw.includes(lw)) score += 7;
      // 全文字段匹配（兜底）
      if (text.indexOf(lw) >= 0) score += 1;
    }
    return { ...s, score };
  });

  // 过滤零分结果
  scored.sort((a, b) => b.score - a.score);

  // 排序选项
  const sortBy = document.getElementById('sortSelect').value;
  if (sortBy === 'name') {
    scored.sort((a, b) => a.n.localeCompare(b.n));
  } else if (sortBy === 'category') {
    scored.sort((a, b) => a.c.localeCompare(b.c) || a.n.localeCompare(b.n));
  }

  return scored;
}

function highlight(text, query) {
  if (!query) return esc(text);
  const expandedQuery = translateChineseQuery(query);
  const words = expandedQuery.split(/\s+/).filter(Boolean);
  let result = esc(text);
  for (const w of words) {
    if (w.length < 2) continue; // 跳过单字高亮，减少噪音
    try {
      const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      result = result.replace(re, '<em>$1</em>');
    } catch(e) { /* 忽略无效正则 */ }
  }
  return result;
}

// ===== 渲染 =====
function renderResults() {
  const resultsDiv = document.getElementById('results');
  const statsBar = document.getElementById('statsBar');
  const paginationDiv = document.getElementById('pagination');

  const filtered = search(currentQuery, currentCategory);
  const total = filtered.length;
  const start = currentPage * PER_PAGE;
  const pageItems = filtered.slice(start, start + PER_PAGE);

  // 状态栏
  statsBar.style.display = 'flex';
  const queryDisplay = currentQuery ? '「' + esc(currentQuery) + '」' : '';
  document.getElementById('resultCount').textContent =
    '找到 ' + total.toLocaleString() + ' 个技能' + queryDisplay +
    (total > 0 ? '（显示第 ' + (start + 1) + '-' + Math.min(start + PER_PAGE, total) + ' 个）' : '');

  // 结果列表
  if (pageItems.length === 0) {
    resultsDiv.innerHTML = '<div class="empty"><div class="icon">&#129335;</div><p>没有找到匹配的技能</p><p style="font-size:0.85rem;margin-top:8px">试试换个关键词，或使用英文搜索</p></div>';
  } else {
    resultsDiv.innerHTML = pageItems.map(r => `
      <div class="result-card" onclick="showDetail('${esc(r.s)}')">
        <div class="header">
          <span class="name">${highlight(r.n, currentQuery)}</span>
          <span class="category-tag" title="${esc(r.c)}">${esc(r.cc)}</span>
          ${r.o ? '<span class="owner">作者：' + esc(r.o) + '</span>' : ''}
        </div>
        <div class="description">${highlight(r.d || '（无描述）', currentQuery)}</div>
        <div class="actions" onclick="event.stopPropagation()">
          <button class="btn primary" onclick="copyInstall('${esc(r.i)}', this)">&#128203; 复制安装命令</button>
          <a class="btn" href="${esc(r.u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="在 ClawHub 查看详情">&#128279; ClawHub 详情</a>
          <span class="btn warn" style="cursor:default;font-size:0.7rem" title="点击卡片查看详情">&#128712; 点击卡片看详情</span>
        </div>
      </div>
    `).join('');
  }

  // 分页
  const totalPages = Math.ceil(total / PER_PAGE);
  if (totalPages > 1) {
    paginationDiv.style.display = 'flex';
    paginationDiv.innerHTML = `
      <button ${currentPage === 0 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">&#8592; 上一页</button>
      <span class="current">第 ${currentPage + 1} / ${totalPages} 页</span>
      <button ${currentPage + 1 >= totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">下一页 &#8594;</button>
    `;
  } else {
    paginationDiv.style.display = 'none';
  }
}

function goPage(p) {
  currentPage = Math.max(0, p);
  renderResults();
  window.scrollTo({ top: 400, behavior: 'smooth' });
}

function showDetail(slug) {
  const skill = searchData.find(s => s.s === slug);
  if (!skill) return;
  document.getElementById('modalTitle').textContent = skill.n;
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>&#128220; 描述</label><p>${esc(skill.d || '暂无描述')}</p></div>
    <div class="field"><label>&#128451; 分类</label><p>${esc(skill.cc)}（${esc(skill.c)}）${skill.ck ? '<br><small style=\'color:var(--text-dim)\'>关键词：' + esc(skill.ck) + '</small>' : ''}</p></div>
    ${skill.o ? '<div class="field"><label>&#128100; 发布者</label><p>' + esc(skill.o) + '</p></div>' : ''}
    <div class="field"><label>&#128187; 安装命令</label><pre><code>${esc(skill.i)}</code></pre></div>
    <div class="field">
      <button class="btn primary" onclick="copyInstall('${esc(skill.i)}', this)">&#128203; 复制安装命令</button>
      <a class="btn" href="${esc(skill.u)}" target="_blank" style="margin-left:8px">&#128279; 在 ClawHub 查看</a>
    </div>
    <div class="field" style="margin-top:12px;padding:8px;background:var(--bg);border-radius:6px;font-size:0.75rem;color:var(--text-dim)">
      &#8505;&#65039; 提示：如果 ClawHub 链接无法打开，请直接使用安装命令在本地安装。
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

function copyInstall(cmd, btn) {
  const ta = document.createElement('textarea');
  ta.innerHTML = cmd;
  navigator.clipboard.writeText(ta.value).then(() => {
    btn.classList.add('copied');
    const origHTML = btn.innerHTML;
    btn.innerHTML = '&#9989; 已复制！';
    showToast('&#9989; 安装命令已复制到剪贴板');
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = origHTML; }, 2000);
  }).catch(() => {
    showToast('&#9888;&#65039; 复制失败，请手动选择复制');
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.innerHTML = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// HTML 转义
function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
</script>
